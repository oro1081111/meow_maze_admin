name: Meow Maze Platform CI

on:
  push:
    branches:
      - platform-v1
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm install --package-lock-only

      - name: Validate, test, and build
        run: npm run check

      - name: Upload player build
        uses: actions/upload-artifact@v4
        with:
          name: meow-maze-player
          path: platform/dist/player

      - name: Upload admin build
        uses: actions/upload-artifact@v4
        with:
          name: meow-maze-admin
          path: platform/dist/admin
